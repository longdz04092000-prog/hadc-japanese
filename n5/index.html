
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>HADC Japanese - JLPT N5</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1265ad">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
   <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>
  <h1>🌸 HADC JAPANESE</h1>
  <p>JLPT N5 – Học miễn phí 100%</p>
</header>

<nav>
  <button onclick="showSection('hiragana')">
    Hiragana
  </button>
  <button onclick="showSection('katakana')">
    Katakana
  </button>
   <button onclick="location.href='vocab.html'">Từ vựng</button>
   <button onclick="location.href='grammar.html'">Ngữ pháp</button>
  <button onclick="startQuiz()">
    Kiểm tra
  </button>
  <button onclick="location.href='../index.html'">
    Trang chủ
  </button>
</nav>

<main>

<section id="hiragana" class="panel">
  <h2>Bảng chữ cái Hiragana – ひらがな</h2>
  <p>Nhấn vào từng chữ để nghe phát âm tiếng Nhật.</p>
  <div id="hiraganaGrid" class="grid"></div>
</section>

<section id="katakana" class="panel hidden">
  <h2>Bảng chữ cái Katakana – カタカナ</h2>
  <p>Nhấn vào từng chữ để nghe phát âm tiếng Nhật.</p>
  <div id="katakanaGrid" class="grid"></div>
</section>

<section id="quiz" class="panel hidden">
  <h2>Kiểm tra bảng chữ cái</h2>
  <p id="progress"></p>
  <h2 id="question"></h2>
  <div id="answers"></div>
  <p id="feedback" aria-live="polite"></p>
  <button id="nextButton"
          onclick="nextQuestion()"
          style="display:none">
    Câu tiếp theo
  </button>
  <div id="result"></div>
</section>

</main>

<footer>
  © 2026 HADC Japanese
</footer>

<script>
// Mỗi dòng: [Hiragana, Katakana, Romaji, (false = không đưa vào quiz)]
const groups = [
  { name: "Âm cơ bản", rows: [
    ["あ","ア","a"],["い","イ","i"],["う","ウ","u"],["え","エ","e"],["お","オ","o"],
    ["か","カ","ka"],["き","キ","ki"],["く","ク","ku"],["け","ケ","ke"],["こ","コ","ko"],
    ["さ","サ","sa"],["し","シ","shi"],["す","ス","su"],["せ","セ","se"],["そ","ソ","so"],
    ["た","タ","ta"],["ち","チ","chi"],["つ","ツ","tsu"],["て","テ","te"],["と","ト","to"],
    ["な","ナ","na"],["に","ニ","ni"],["ぬ","ヌ","nu"],["ね","ネ","ne"],["の","ノ","no"],
    ["は","ハ","ha"],["ひ","ヒ","hi"],["ふ","フ","fu"],["へ","ヘ","he"],["ほ","ホ","ho"],
    ["ま","マ","ma"],["み","ミ","mi"],["む","ム","mu"],["め","メ","me"],["も","モ","mo"],
    ["や","ヤ","ya"],["ゆ","ユ","yu"],["よ","ヨ","yo"],
    ["ら","ラ","ra"],["り","リ","ri"],["る","ル","ru"],["れ","レ","re"],["ろ","ロ","ro"],
    ["わ","ワ","wa"],["を","ヲ","wo"],["ん","ン","n"]
  ]},
  { name: "Âm đục (dakuten) ゛", rows: [
    ["が","ガ","ga"],["ぎ","ギ","gi"],["ぐ","グ","gu"],["げ","ゲ","ge"],["ご","ゴ","go"],
    ["ざ","ザ","za"],["じ","ジ","ji"],["ず","ズ","zu"],["ぜ","ゼ","ze"],["ぞ","ゾ","zo"],
    ["だ","ダ","da"],["ぢ","ヂ","ji",false],["づ","ヅ","zu",false],["で","デ","de"],["ど","ド","do"],
    ["ば","バ","ba"],["び","ビ","bi"],["ぶ","ブ","bu"],["べ","ベ","be"],["ぼ","ボ","bo"]
  ]},
  { name: "Âm bán đục (handakuten) ゜", rows: [
    ["ぱ","パ","pa"],["ぴ","ピ","pi"],["ぷ","プ","pu"],["ぺ","ペ","pe"],["ぽ","ポ","po"]
  ]},
  { name: "Âm ghép (yōon)", rows: [
    ["きゃ","キャ","kya"],["きゅ","キュ","kyu"],["きょ","キョ","kyo"],
    ["しゃ","シャ","sha"],["しゅ","シュ","shu"],["しょ","ショ","sho"],
    ["ちゃ","チャ","cha"],["ちゅ","チュ","chu"],["ちょ","チョ","cho"],
    ["にゃ","ニャ","nya"],["にゅ","ニュ","nyu"],["にょ","ニョ","nyo"],
    ["ひゃ","ヒャ","hya"],["ひゅ","ヒュ","hyu"],["ひょ","ヒョ","hyo"],
    ["みゃ","ミャ","mya"],["みゅ","ミュ","myu"],["みょ","ミョ","myo"],
    ["りゃ","リャ","rya"],["りゅ","リュ","ryu"],["りょ","リョ","ryo"],
    ["ぎゃ","ギャ","gya"],["ぎゅ","ギュ","gyu"],["ぎょ","ギョ","gyo"],
    ["じゃ","ジャ","ja"],["じゅ","ジュ","ju"],["じょ","ジョ","jo"],
    ["びゃ","ビャ","bya"],["びゅ","ビュ","byu"],["びょ","ビョ","byo"],
    ["ぴゃ","ピャ","pya"],["ぴゅ","ピュ","pyu"],["ぴょ","ピョ","pyo"]
  ]}
];

// scriptIndex: 0 = Hiragana, 1 = Katakana
function buildList(scriptIndex) {
  const list = [];
  groups.forEach(group => {
    group.rows.forEach(row => {
      list.push({
        letter: row[scriptIndex],
        reading: row[2],
        group: group.name,
        inQuiz: row[3] !== false
      });
    });
  });
  return list;
}

const hiragana = buildList(0);
const katakana = buildList(1);

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("Trình duyệt không hỗ trợ phát âm.");
    return;
  }
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "ja-JP";
  voice.rate = 0.75;
  speechSynthesis.speak(voice);
}

function createGrid(id, items) {
  const grid = document.getElementById(id);
  let lastGroup = "";

  items.forEach(item => {
    if (item.group !== lastGroup) {
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = item.group;
      grid.appendChild(title);
      lastGroup = item.group;
    }

    const box = document.createElement("div");
    box.className = "letter";

    const character = document.createElement("strong");
    character.textContent = item.letter;

    const reading = document.createElement("small");
    reading.textContent = item.reading;

    box.append(character, reading);
    box.addEventListener("click", () => speak(item.letter));
    grid.appendChild(box);
  });
}

createGrid("hiraganaGrid", hiragana);
createGrid("katakanaGrid", katakana);

function showSection(id) {
  document.querySelectorAll("main section").forEach(
    section => section.classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

let questions = [];
let current = 0;
let score = 0;

function shuffle(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  // ぢ/づ đọc giống じ/ず nên bỏ khỏi quiz để tránh đáp án mơ hồ
  const pool = [...hiragana, ...katakana].filter(item => item.inQuiz);

  questions = shuffle(pool).slice(0, 10);
  current = 0;
  score = 0;
  showSection("quiz");
  document.getElementById("result").textContent = "";
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById("progress").textContent =
    "Câu " + (current + 1) + "/10";

  document.getElementById("question").textContent =
    "Chữ " + q.letter + " đọc là gì?";

  document.getElementById("feedback").textContent = "";
  document.getElementById("nextButton").style.display = "none";

  const allReadings = [...new Set(
    [...hiragana, ...katakana].map(item => item.reading)
  )];
  const others = shuffle(
    allReadings.filter(r => r !== q.reading)
  ).slice(0, 3);

  const options = shuffle([q.reading, ...others]);
  const area = document.getElementById("answers");
  area.innerHTML = "";

  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = option;
    button.addEventListener(
      "click", () => chooseAnswer(option, q.reading)
    );
    area.appendChild(button);
  });
}

function chooseAnswer(selected, correct) {
  const buttons = document.querySelectorAll(".answer");

  buttons.forEach(button => {
    button.disabled = true;

    if (button.textContent === correct) {
      button.classList.add("correct");
    } else if (button.textContent === selected) {
      button.classList.add("wrong");
    }
  });

  if (selected === correct) {
    score++;
    document.getElementById("feedback").textContent = "Chính xác!";
  } else {
    document.getElementById("feedback").textContent =
      "Đáp án đúng: " + correct;
  }

  document.getElementById("nextButton").style.display = "inline-block";
  document.getElementById("nextButton").textContent =
    current === 9 ? "Xem kết quả" : "Câu tiếp theo";
}

function nextQuestion() {
  current++;

  if (current < questions.length) {
    showQuestion();
    return;
  }

  document.getElementById("question").textContent =
    "Hoàn thành bài kiểm tra!";
  document.getElementById("progress").textContent = "";
  document.getElementById("answers").innerHTML = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextButton").style.display = "none";

  let best = 0;
  try {
    best = Number(localStorage.getItem("hadc_n5_best") || 0);
    if (score > best) {
      best = score;
      localStorage.setItem("hadc_n5_best", best);
    }
  } catch (error) {
    best = Math.max(best, score);
  }

  const result = document.getElementById("result");
  result.textContent =
    "Điểm của bạn: " + score + "/10. " +
    "Điểm cao nhất: " + best + "/10.";

  const retry = document.createElement("button");
  retry.textContent = "Làm lại bài kiểm tra";
  retry.addEventListener("click", startQuiz);
  result.appendChild(document.createElement("p"));
  result.appendChild(retry);
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("../sw.js");
  }
</script>

</body>
</html>
